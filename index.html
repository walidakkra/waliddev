<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحة ويب رياكت</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Tajawal", "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #f7f7fb;
        color: #1f2a44;
      }
      .hero {
        max-width: 960px;
        margin: 0 auto;
        padding: 80px 24px 48px;
        text-align: center;
      }
      .hero h1 {
        font-size: clamp(2.1rem, 4vw, 3rem);
        margin-bottom: 12px;
      }
      .hero p {
        margin: 0 auto 32px;
        max-width: 640px;
        font-size: 1.1rem;
        line-height: 1.8;
        color: #4b5563;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 18px 40px rgba(31, 42, 68, 0.1);
        text-align: right;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      .card span {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #e0ecff;
        color: #1d4ed8;
        font-size: 0.8rem;
      }
      .cta {
        margin-top: 36px;
        display: inline-flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        background: #2563eb;
        color: #ffffff;
        border-radius: 999px;
        border: none;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.3);
      }
      .cta:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script>
      const cards = [
        { title: "واجهة سريعة", label: "React 18" },
        { title: "تصميم حديث", label: "UI مرن" },
        { title: "مكونات قابلة لإعادة الاستخدام", label: "Components" },
      ];

      const App = () =>
        React.createElement(
          "main",
          { className: "hero" },
          React.createElement("h1", null, "صفحة ويب رياكت"),
          React.createElement(
            "p",
            null,
            "واجهة عربية بسيطة مبنية برياكت تعرض قسمًا تعريفيًا وبطاقات مميزات. يمكنك تعديل المحتوى أو الألوان بسهولة."
          ),
          React.createElement(
            "section",
            { className: "cards" },
            cards.map((card) =>
              React.createElement(
                "article",
                { className: "card", key: card.title },
                React.createElement("h3", null, card.title),
                React.createElement("span", null, card.label)
              )
            )
          ),
          React.createElement(
            "button",
            {
              className: "cta",
              onClick: () => alert("جاهز للبدء؟ لننطلق!"),
            },
            "ابدأ الآن"
          )
        );

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
